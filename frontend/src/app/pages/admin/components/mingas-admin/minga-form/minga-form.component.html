<app-modal
  titulo="Nueva minga comunitaria"
  subtitulo="Después de guardar podrá enviar la convocatoria por WhatsApp."
  icono="ri-tools-line"
  tono="success"
  tamano="md"
  [bloqueado]="guardando"
  (cerrar)="cerrar.emit()"
>
  <form #mingaForm="ngForm" (ngSubmit)="guardar()">
    <fieldset class="modal__body form-stack" [disabled]="guardando">
      <div class="form-group">
        <label for="minga-titulo">Actividad / título *</label>
        <input id="minga-titulo" class="input" name="titulo" [(ngModel)]="formulario.titulo" required maxlength="200"
          placeholder="Limpieza del canal principal" />
      </div>
      <div class="form-group">
        <label for="minga-descripcion">Trabajo a realizar *</label>
        <textarea id="minga-descripcion" class="input" name="descripcion" [(ngModel)]="formulario.descripcion" required rows="3"
          placeholder="Detalle las actividades y las herramientas necesarias"></textarea>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label for="minga-fecha">Fecha *</label>
          <input id="minga-fecha" class="input" type="date" name="fecha" [(ngModel)]="formulario.fecha" required />
        </div>
        <div class="form-group">
          <label for="minga-hora">Hora de inicio *</label>
          <input id="minga-hora" class="input" type="time" name="hora" [(ngModel)]="formulario.hora_inicio" required />
        </div>
      </div>
      <div class="form-group">
        <label for="minga-lugar">Lugar de encuentro *</label>
        <input id="minga-lugar" class="input" name="lugar" [(ngModel)]="formulario.lugar" required maxlength="255"
          placeholder="Punto de encuentro de los comuneros" />
      </div>
      <section class="inset-panel">
        <label class="switch-row">
          <input type="checkbox" name="aplicaMulta" [(ngModel)]="formulario.genera_multa_ausencia" />
          <span>Aplica multa por ausencia</span>
        </label>
        @if (formulario.genera_multa_ausencia) {
          <app-multa-configurada tipo="MINGA" />
        }
      </section>
      @if (error) {
        <div class="alert alert--danger" role="alert">{{ error }}</div>
      }
    </fieldset>
    <div class="modal__footer">
      <button type="button" class="btn btn--outline" (click)="cerrar.emit()" [disabled]="guardando">Cancelar</button>
      <button type="submit" class="btn btn--primary" [disabled]="mingaForm.invalid || guardando">
        @if (guardando) {
          <span class="spinner spinner--sm" aria-hidden="true"></span> Guardando…
        } @else {
          <i class="ri-save-line" aria-hidden="true"></i> Guardar minga
        }
      </button>
    </div>
  </form>
</app-modal>
