<div class="admin-layout">
  <!-- SIDEBAR -->
  <aside class="sidebar" aria-label="Menú del panel administrativo">
    <div class="sidebar__logo">
      <i class="ri-drop-fill" aria-hidden="true"></i>
      <h2>La Jones</h2>
    </div>

    <nav class="sidebar__nav" aria-label="Secciones del panel">
      @for (item of menu; track item.ruta) {
        <a class="nav-item" [routerLink]="item.ruta" routerLinkActive="active" ariaCurrentWhenActive="page">
          <i [class]="item.icono" aria-hidden="true"></i> {{ item.etiqueta }}
        </a>
      }
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <header class="main-header">
      <div>
        <h1 class="main-header__title">Sistema Integrado de Gestión</h1>
        <p class="main-header__subtitle">Junta de Agua y Riego "La Jones" - Patate</p>
      </div>
      <div class="header-actions">
        <a class="btn btn--outline btn-whatsapp" routerLink="/admin/asistencias" [queryParams]="{ whatsapp: 1 }">
          <i class="ri-whatsapp-line" aria-hidden="true"></i> WhatsApp Web
        </a>
        <span class="badge badge--success"><i class="ri-pulse-line" aria-hidden="true"></i> Sistema en Línea</span>
      </div>
    </header>

    <div class="tab-view">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
