<div class="login-page">
  <div class="login-card card card--glass">
    <div class="login-header">
      <div class="brand-logo">
        <i class="ri-drop-fill"></i>
      </div>
      <h2>Sistema Integrado Junta La Jones</h2>
      <p class="caption">Portal Administrativo — Iniciar Sesión</p>
    </div>

    <div class="alert alert--danger" *ngIf="errorMensaje">
      <i class="ri-error-warning-line"></i> {{ errorMensaje }}
    </div>

    <div class="alert alert--success" *ngIf="exitoMensaje" style="background-color: rgba(46, 204, 113, 0.1); color: #2ecc71; border: 1px solid #2ecc71; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem;">
      <i class="ri-checkbox-circle-line"></i> {{ exitoMensaje }}
    </div>

    <!-- FLUJO LOGIN NORMAL -->
    <form *ngIf="!requiereCambioPassword" (submit)="iniciarSesion(); $event.preventDefault();" class="login-form">
      <div class="form-group">
        <label for="usuario"><i class="ri-user-line"></i> Usuario o Cédula</label>
        <input 
          type="text" 
          id="usuario"
          class="form-control" 
          placeholder="Ingrese su usuario" 
          [(ngModel)]="usuario" 
          name="usuario" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="password"><i class="ri-lock-password-line"></i> Contraseña</label>
        <div class="password-input-wrapper">
          <input 
            [type]="mostrarPassword ? 'text' : 'password'" 
            id="password"
            class="form-control" 
            placeholder="••••••••" 
            [(ngModel)]="password" 
            name="password" 
            required 
          />
          <button type="button" class="btn-toggle-eye" (click)="togglePassword()">
            <i [class]="mostrarPassword ? 'ri-eye-off-line' : 'ri-eye-line'"></i>
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" checked /> Recordar mi sesión
        </label>
        <a href="javascript:void(0)" class="forgot-link">¿Olvidó su contraseña?</a>
      </div>

      <button type="submit" class="btn btn--primary btn--lg btn-block" [disabled]="cargando">
        <i class="ri-login-box-line" *ngIf="!cargando"></i>
        <i class="ri-loader-4-line spin" *ngIf="cargando"></i>
        {{ cargando ? 'Verificando...' : 'Ingresar al Sistema' }}
      </button>
    </form>

    <!-- FLUJO CAMBIO DE CONTRASEÑA -->
    <form *ngIf="requiereCambioPassword" (submit)="cambiarPassword(); $event.preventDefault();" class="login-form">
      <div class="alert" style="background-color: rgba(52, 152, 219, 0.1); color: #3498db; border: 1px solid #3498db; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9rem;">
        <i class="ri-information-line"></i> Por seguridad, debe cambiar su contraseña por defecto para poder ingresar al sistema.
      </div>
      
      <div class="form-group">
        <label for="nuevaPassword1"><i class="ri-lock-password-line"></i> Nueva Contraseña</label>
        <input 
          type="password" 
          id="nuevaPassword1"
          class="form-control" 
          placeholder="Mínimo 6 caracteres" 
          [(ngModel)]="nuevaPassword1" 
          name="nuevaPassword1" 
          required 
          minlength="6"
        />
      </div>

      <div class="form-group">
        <label for="nuevaPassword2"><i class="ri-lock-password-line"></i> Confirmar Contraseña</label>
        <input 
          type="password" 
          id="nuevaPassword2"
          class="form-control" 
          placeholder="Repita su contraseña" 
          [(ngModel)]="nuevaPassword2" 
          name="nuevaPassword2" 
          required 
        />
      </div>

      <button type="submit" class="btn btn--primary btn--lg btn-block" [disabled]="cargando">
        <i class="ri-save-line" *ngIf="!cargando"></i>
        <i class="ri-loader-4-line spin" *ngIf="cargando"></i>
        {{ cargando ? 'Guardando...' : 'Cambiar Contraseña' }}
      </button>
    </form>

    <div class="login-footer">
      <small>© 2026 Junta de Agua y Riego "La Jones" — Patate</small>
    </div>
  </div>
</div>
