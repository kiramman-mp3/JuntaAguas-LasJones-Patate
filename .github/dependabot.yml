version: 2

# Propuestas semanales de actualización. Cada una abre un pull request que debe pasar el CI antes de integrarse;
# las de seguridad llegan aparte y sin esperar a la semana.
updates:
  - package-ecosystem: npm
    directory: /backend
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      dependencias-menores: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      dependencias-menores: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /whatsapp-service
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      dependencias-menores: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /e2e
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      dependencias-menores: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
